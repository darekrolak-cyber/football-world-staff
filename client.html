<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Football World Antalya — Client January 2027</title><style>:root{--navy:#10365d;--navy2:#1a4774;--bg:#f4f7fa;--border:#d9e3ec;--soft:#eef3f7;--muted:#6b7b8c;--free2:#4caf50;--booked2:#ff6b3d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#17273a}.header{background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;padding:18px 22px;display:flex;justify-content:space-between;gap:14px;align-items:center;position:sticky;top:0;z-index:20}.brand{display:flex;gap:12px;align-items:center}.brand h1{margin:0;font-size:24px}.brand p{margin:4px 0 0;font-size:13px;opacity:.85}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.badge{background:#fff;color:var(--navy);padding:9px 14px;border-radius:999px;font-weight:700;font-size:13px}.lang button{border:1px solid #ffffff77;border-radius:9px;background:transparent;color:#fff;padding:8px 11px;font-weight:700;cursor:pointer}.lang button.active{background:#fff;color:var(--navy)}.wrap{max-width:1600px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.top h2{margin:0;color:var(--navy);font-size:26px}.legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px}.dot{width:14px;height:14px;border-radius:4px;display:inline-block;vertical-align:middle;margin-right:5px}.card{background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 4px 18px #10365d0d;padding:12px}.scroll{overflow:auto;-webkit-overflow-scrolling:touch}.month{display:grid;grid-template-columns:repeat(7,minmax(190px,1fr));gap:8px;min-width:1380px}.weekday{background:var(--soft);color:var(--navy);padding:10px;border-radius:8px;text-align:center;font-weight:700;font-size:12px}.day{background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px;min-height:230px}.day.out{opacity:.26}.daytop{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px}.dateLabel{display:flex;align-items:baseline;gap:5px}.num{font-size:20px;font-weight:700;color:var(--navy)}.monthTag{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase}.meta{font-size:10px;color:var(--muted);text-align:right}.slot{display:grid;grid-template-columns:65px 1fr;gap:6px;align-items:center;margin:6px 0}.time{font-size:10px;font-weight:700;color:#41566c}.pitches{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}.pitch{height:17px;border-radius:4px;position:relative;border:1px solid rgba(0,0,0,.04)}.pitch.free{background:var(--free2)}.pitch.booked{background:var(--booked2)}.pitch:after{content:attr(data-p);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:8px;font-weight:700;opacity:.9}.hint{font-size:11px;color:var(--muted);margin-top:8px}.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.chip{background:#fff;border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:12px}.chip strong{color:var(--navy)}@media(max-width:760px){.header{align-items:flex-start;flex-direction:column}.wrap{padding:10px}.top{align-items:flex-start;flex-direction:column}.month{grid-template-columns:1fr;min-width:0}.weekday{display:none}.day.out{display:none}.day{min-height:auto}.slot{grid-template-columns:74px 1fr}.pitch{height:22px}}</style></head><body><div class="header"><div class="brand"><div style="font-size:34px">⚽</div><div><h1>FOOTBALL WORLD ANTALYA</h1><p id="subtitle">Client availability · January 2027</p></div></div><div class="actions"><div class="lang"><button id="enBtn" class="active" onclick="setLang('en')">EN</button><button id="plBtn" onclick="setLang('pl')">PL</button><button id="ukBtn" onclick="setLang('uk')">UKR</button></div><div class="badge" id="badge">CLIENT VIEW</div></div></div><div class="wrap"><div class="top"><h2 id="monthTitle">January 2027</h2><div class="legend"><span><i class="dot" style="background:var(--free2)"></i><span id="freeText">Available</span></span><span><i class="dot" style="background:var(--booked2)"></i><span id="bookedText">Booked</span></span></div></div><div class="summary" id="summary"></div><div class="card"><div class="scroll"><div class="month" id="month"></div></div><div class="hint" id="hint">Each row is one 90-minute training slot. Squares 1–6 represent pitches. Hover a booked square to see the team.</div></div></div><script>const CFG=[['KOREA FC','2027-01-04','2027-02-01'],['Radomiak','2027-01-10','2027-01-20'],['Bruk BET','2027-01-10','2027-01-20'],['ARKA Gdynia','2027-01-17','2027-01-27'],['Grodzisk FC','2027-01-20','2027-01-27']];const TRAIN=['10:30–12:00','16:00–17:30'];const SLOTS=['08:30–10:00','10:30–12:00','12:00–13:30','14:00–15:30','16:00–17:30'];const P=[1,2,3,4,5,6];let LANG='en';function mk(){const used=new Set(),b=[];for(const[team,s,e]of CFG){for(let d=new Date(s+'T12:00:00'),z=new Date(e+'T12:00:00');d<=z;d.setDate(d.getDate()+1)){if(d.getFullYear()!==2027||d.getMonth()!==0)continue;const ds=d.toISOString().slice(0,10);for(const time of TRAIN){let pitch=1;while(used.has(ds+'|'+pitch+'|'+time))pitch++;if(pitch<=6){used.add(ds+'|'+pitch+'|'+time);b.push({date:ds,pitch,time,team})}}}}return b}const BOOKINGS=mk();const T={en:{subtitle:'Client availability · January 2027',badge:'CLIENT VIEW',month:'January 2027',monthTag:'JAN',free:'Available',booked:'Booked',hint:'Each row is one 90-minute training slot. Squares 1–6 represent pitches. Hover a booked square to see the team.',days:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],occupied:'occupied',freeSlots:'free pitch-slots',bookedSlots:'booked pitch-slots',pitch:'Pitch'},pl:{subtitle:'Dostępność dla klienta · Styczeń 2027',badge:'WIDOK KLIENTA',month:'Styczeń 2027',monthTag:'styczeń',free:'Wolne',booked:'Zajęte',hint:'Każdy wiersz to jeden 90-minutowy slot. Kwadraty 1–6 oznaczają boiska. Najedź na zajęte pole, aby zobaczyć nazwę drużyny.',days:['Pon','Wt','Śr','Czw','Pt','Sob','Niedz'],occupied:'zajęte',freeSlots:'wolne sloty-boiska',bookedSlots:'zajęte sloty-boiska',pitch:'Boisko'},uk:{subtitle:'Доступність для клієнта · Січень 2027',badge:'ПЕРЕГЛЯД КЛІЄНТА',month:'Січень 2027',monthTag:'січень',free:'Вільно',booked:'Зайнято',hint:'Кожен рядок — це один 90-хвилинний тренувальний слот. Квадрати 1–6 означають поля. Наведіть курсор на зайнятий квадрат, щоб побачити назву команди.',days:['Пн','Вт','Ср','Чт','Пт','Сб','Нд'],occupied:'зайнято',freeSlots:'вільні слоти-поля',bookedSlots:'зайняті слоти-поля',pitch:'Поле'}};function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function setLang(l){LANG=l;enBtn.classList.toggle('active',l==='en');plBtn.classList.toggle('active',l==='pl');ukBtn.classList.toggle('active',l==='uk');render()}function render(){const x=T[LANG];subtitle.textContent=x.subtitle;badge.textContent=x.badge;monthTitle.textContent=x.month;freeText.textContent=x.free;bookedText.textContent=x.booked;hint.textContent=x.hint;const total=31*5*6,booked=BOOKINGS.length;summary.innerHTML=`<div class="chip"><strong>${booked}</strong> ${x.bookedSlots}</div><div class="chip"><strong>${total-booked}</strong> ${x.freeSlots}</div>`;let h='';for(const w of x.days)h+=`<div class="weekday">${w}</div>`;const first=new Date('2027-01-01T12:00:00'),off=(first.getDay()+6)%7,start=new Date(first);start.setDate(first.getDate()-off);for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=d.toISOString().slice(0,10),inMonth=d.getMonth()===0&&d.getFullYear()===2027,day=BOOKINGS.filter(b=>b.date===ds);let rows='';for(const s of SLOTS){let sq='';for(const p of P){const b=day.find(z=>z.time===s&&z.pitch===p);const title=b?`${ds} · ${s} · ${x.pitch} ${p} · ${b.team}`:`${ds} · ${s} · ${x.pitch} ${p} · ${x.free}`;sq+=`<div class="pitch ${b?'booked':'free'}" data-p="${p}" title="${esc(title)}"></div>`}rows+=`<div class="slot"><div class="time">${s}</div><div class="pitches">${sq}</div></div>`}h+=`<div class="day ${inMonth?'':'out'}"><div class="daytop"><div class="dateLabel"><div class="num">${d.getDate()}</div><div class="monthTag">${inMonth?x.monthTag:''}</div></div><div class="meta">${day.length}/30 ${x.occupied}</div></div>${rows}</div>`}month.innerHTML=h}render();</script></body></html>
