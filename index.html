<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Football World Antalya — Staff</title><style>:root{--navy:#102f50;--navy2:#173d63;--bg:#f4f7fa;--border:#dbe4ec;--muted:#66778a;--free:#dff5e3;--freeText:#176b2d;--booked:#ffe0e0;--bookedText:#8b1e1e}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#162337}.header{background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;padding:18px 24px;display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{display:flex;gap:12px;align-items:center}.brand h1{margin:0;font-size:24px}.brand p{margin:4px 0 0;opacity:.8;font-size:13px}.ball{font-size:34px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.staff{background:#fff;color:var(--navy);padding:9px 14px;border-radius:999px;font-weight:700;font-size:13px}.lang button{border:1px solid #ffffff77;background:transparent;color:#fff;padding:8px 11px;border-radius:8px}.lang button.active{background:#fff;color:var(--navy)}.wrap{max-width:1500px;margin:auto;padding:18px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}input,button{font:inherit;border:1px solid var(--border);border-radius:8px;background:#fff;padding:9px 11px}button{cursor:pointer;color:var(--navy);font-weight:700}.mode button.active{background:var(--navy);color:#fff}.legend{margin-left:auto;display:flex;gap:15px;font-size:12px;color:var(--muted)}.dot{width:14px;height:14px;border-radius:4px;display:inline-block;vertical-align:middle;margin-right:5px}.card{background:#fff;border:1px solid var(--border);border-radius:13px;box-shadow:0 4px 18px rgba(16,47,80,.05);padding:12px}.scroller{overflow:auto}table.schedule{width:100%;min-width:1000px;border-collapse:separate;border-spacing:4px}.schedule th{background:#eaf0f5;color:var(--navy);padding:11px;font-size:12px;border-radius:7px}.schedule thead th:not(:first-child){background:var(--navy);color:#fff}.schedule td{height:58px;padding:7px;text-align:center;border-radius:8px;font-size:12px}.free{background:var(--free);color:var(--freeText)}.booked{background:var(--booked);color:var(--bookedText)}.schedule td strong,.schedule td span{display:block}.schedule td span{font-size:10px;margin-top:4px}.sectionTitle{font-size:20px;color:var(--navy);margin:20px 0 10px}.list{width:100%;border-collapse:collapse}.list th,.list td{padding:10px;border-bottom:1px solid var(--border);font-size:12px;text-align:left}.list th{background:#eef3f7;color:var(--navy)}.status{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--booked);color:var(--bookedText);font-weight:700}.empty{padding:24px;text-align:center;color:var(--muted)}.note{font-size:12px;color:var(--muted);margin-top:10px}.monthGrid{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;min-width:1080px}.monthHead{font-size:12px;font-weight:700;color:var(--navy);background:#eaf0f5;padding:9px;border-radius:7px;text-align:center}.dayCell{min-height:150px;border:1px solid var(--border);border-radius:10px;padding:8px;background:#fff;cursor:pointer}.dayCell.out{opacity:.35}.dayNum{font-weight:700;color:var(--navy);margin-bottom:7px;display:flex;align-items:baseline;gap:6px}.dayNum .num{font-size:20px}.dayNum .mon{font-size:11px;color:var(--muted);text-transform:uppercase}.dayStat{font-size:11px;margin:3px 0}.dayClubs{display:flex;flex-direction:column;gap:4px;margin-top:6px}.dayTag{background:#f8dada;color:var(--bookedText);border:1px solid #efc7c7;border-radius:8px;padding:5px 6px;font-size:10px;line-height:1.25}.dayTag strong{display:block}.dayTag span{display:block;color:#6f2d2d;margin-top:1px}.dayFree{font-size:11px;color:var(--freeText);font-weight:700;margin-top:6px}@media(max-width:700px){.header{align-items:flex-start;flex-direction:column}.legend{margin-left:0}.wrap{padding:10px}}</style></head><body><div class="header"><div class="brand"><div class="ball">⚽</div><div><h1>FOOTBALL WORLD ANTALYA</h1><p id="seasonText">Pitch availability · 10 Dec 2026 – 30 Apr 2027</p></div></div><div class="actions"><div class="lang"><button id="enBtn" class="active" onclick="setLang('en')">EN</button><button id="plBtn" onclick="setLang('pl')">PL</button></div><div class="staff" id="staffBadge">STAFF · READ ONLY</div></div></div><div class="wrap"><div class="toolbar"><div class="mode"><button id="dayBtn" class="active" onclick="setMode('day')">Day</button><button id="monthBtn" onclick="setMode('month')">Month</button></div><button onclick="move(-1)">←</button><input id="date" type="date" min="2026-12-10" max="2027-04-30" value="2027-01-20" onchange="render()"><button onclick="move(1)">→</button><div class="legend"><span><i class="dot" style="background:var(--free)"></i><span id="freeLegend">Available</span></span><span><i class="dot" style="background:var(--booked)"></i><span id="bookedLegend">Booked</span></span></div></div><div id="dayView"><div class="card"><div class="scroller"><table class="schedule" id="schedule"></table></div><div class="note" id="freeNote">All remaining time periods are automatically shown as available.</div></div><h2 class="sectionTitle" id="listTitle"></h2><div class="card"><div class="scroller"><table class="list" id="list"></table></div></div></div><div id="monthView" style="display:none"><div class="card"><div class="scroller"><div class="monthGrid" id="monthGrid"></div></div></div></div></div><script>const CFG=[['KOREA FC','2027-01-04','2027-02-01'],['Radomiak','2027-01-10','2027-01-20'],['Bruk BET','2027-01-10','2027-01-20'],['ARKA Gdynia','2027-01-17','2027-01-27'],['Grodzisk FC','2027-01-20','2027-01-27']];const TRAIN=['10:30–12:00','16:00–17:30'];const ROWS=['08:30–10:00','10:00–10:30','10:30–12:00','12:00–13:00','13:00–14:30','14:30–16:00','16:00–17:30'];const P=[1,2,3,4,5,6];let LANG='en',MODE='day';function mk(){const o=new Set,b=[];for(const [team,s,e] of CFG){for(let d=new Date(s+'T12:00:00'),z=new Date(e+'T12:00:00');d<=z;d.setDate(d.getDate()+1)){const ds=d.toISOString().slice(0,10);for(const t of TRAIN){let p=1;while(o.has(ds+'|'+p+'|'+t))p++;o.add(ds+'|'+p+'|'+t);b.push({date:ds,pitch:p,time:t,team})}}}return b}const BOOKINGS=mk();const T={pl:{season:'Dostępność boisk · 10.12.2026 – 30.04.2027',staff:'STAFF · TYLKO PODGLĄD',day:'Dzień',month:'Miesiąc',free:'Wolne',booked:'Zarezerwowane',time:'Godzina',pitch:'Boisko',team:'Drużyna',status:'Status',notes:'Uwagi',training:'Trening',none:'Brak rezerwacji w tym dniu.',reservations:'Rezerwacje',freeNote:'Pozostałe godziny są automatycznie pokazywane jako wolne.',weekdays:['Pon','Wt','Śr','Czw','Pt','Sob','Niedz'],occupied:'zajętych',slots:'rezerwacji',fullFree:'Wszystko wolne',months:['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'],pitchShort:'Boisko'},en:{season:'Pitch availability · 10 Dec 2026 – 30 Apr 2027',staff:'STAFF · READ ONLY',day:'Day',month:'Month',free:'Available',booked:'Booked',time:'Time',pitch:'Pitch',team:'Team',status:'Status',notes:'Notes',training:'Training',none:'No bookings on this day.',reservations:'Bookings',freeNote:'All remaining time periods are automatically shown as available.',weekdays:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],occupied:'occupied',slots:'bookings',fullFree:'All available',months:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],pitchShort:'Pitch'}};function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function setLang(l){LANG=l;enBtn.classList.toggle('active',l==='en');plBtn.classList.toggle('active',l==='pl');seasonText.textContent=T[l].season;staffBadge.textContent=T[l].staff;dayBtn.textContent=T[l].day;monthBtn.textContent=T[l].month;freeLegend.textContent=T[l].free;bookedLegend.textContent=T[l].booked;freeNote.textContent=T[l].freeNote;render()}function setMode(m){MODE=m;dayBtn.classList.toggle('active',m==='day');monthBtn.classList.toggle('active',m==='month');dayView.style.display=m==='day'?'block':'none';monthView.style.display=m==='month'?'block':'none';render()}function move(n){const e=date,d=new Date(e.value+'T12:00:00');MODE==='month'?d.setMonth(d.getMonth()+n):d.setDate(d.getDate()+n);e.value=d.toISOString().slice(0,10);render()}function render(){MODE==='month'?renderMonth():renderDay()}function renderDay(){const x=T[LANG],ds=date.value,day=BOOKINGS.filter(b=>b.date===ds),map=new Map(day.map(b=>[b.pitch+'|'+b.time,b]));let h='<thead><tr><th>'+x.time+'</th>'+P.map(p=>`<th>${x.pitch} ${p}</th>`).join('')+'</tr></thead><tbody>';for(const t of ROWS){h+=`<tr><th>${t}</th>`;for(const p of P){const b=map.get(p+'|'+t);h+=b?`<td class="booked"><strong>${esc(b.team)}</strong><span>${x.training}</span></td>`:`<td class="free"><strong>${x.free}</strong></td>`}h+='</tr>'}schedule.innerHTML=h+'</tbody>';listTitle.textContent=x.reservations+' — '+ds.split('-').reverse().join('.');let l=`<thead><tr><th>${x.time}</th><th>${x.pitch}</th><th>${x.team}</th><th>${x.status}</th><th>${x.notes}</th></tr></thead><tbody>`;if(!day.length)l+=`<tr><td colspan="5" class="empty">${x.none}</td></tr>`;else for(const b of day.sort((a,b)=>a.time.localeCompare(b.time)||a.pitch-b.pitch))l+=`<tr><td>${b.time}</td><td>${x.pitch} ${b.pitch}</td><td><strong>${esc(b.team)}</strong></td><td><span class="status">${x.booked}</span></td><td>${x.training}</td></tr>`;list.innerHTML=l+'</tbody>'}function renderMonth(){const x=T[LANG],s=new Date(date.value+'T12:00:00'),y=s.getFullYear(),m=s.getMonth(),f=new Date(y,m,1),off=(f.getDay()+6)%7,g=new Date(y,m,1-off);let h='';for(const w of x.weekdays)h+=`<div class="monthHead">${w}</div>`;for(let i=0;i<42;i++){const d=new Date(g);d.setDate(g.getDate()+i);const ds=d.toISOString().slice(0,10),day=BOOKINGS.filter(b=>b.date===ds),pitches=[...new Set(day.map(b=>b.pitch))],items=day.sort((a,b)=>a.time.localeCompare(b.time)||a.pitch-b.pitch).map(b=>`<div class="dayTag"><strong>${esc(b.team)}</strong><span>${x.pitchShort} ${b.pitch} · ${b.time}</span></div>`).join('');h+=`<div class="dayCell ${d.getMonth()===m?'':'out'}" onclick="openDay('${ds}')"><div class="dayNum"><span class="num">${d.getDate()}</span><span class="mon">${x.months[d.getMonth()]}</span></div>${day.length?`<div class="dayStat"><strong>${day.length}</strong> ${x.slots}</div><div class="dayStat">${pitches.length}/6 ${x.occupied}</div><div class="dayClubs">${items}</div>`:`<div class="dayFree">${x.fullFree}</div>`}</div>`}monthGrid.innerHTML=h}function openDay(ds){date.value=ds;setMode('day')}render();</script></body></html>
