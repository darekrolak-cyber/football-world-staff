<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Football World Antalya — Staff</title><style>:root{--navy:#10365d;--navy2:#1a4774;--bg:#f4f7fa;--border:#d9e3ec;--muted:#6b7b8c;--soft:#eef3f7;--green:#dff5e3;--greenText:#166534;--orange:#ffe7c2;--orangeText:#9a4b00;--red:#fee2e2;--redText:#991b1b}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#17273a}.header{background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;padding:18px 22px;display:flex;justify-content:space-between;gap:14px;align-items:center;position:sticky;top:0;z-index:20}.brand{display:flex;gap:12px;align-items:center}.brand h1{margin:0;font-size:24px}.brand p{margin:4px 0 0;font-size:13px;opacity:.85}.actions,.toolbar,.mode,.legend{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.badge{background:#fff;color:var(--navy);padding:9px 14px;border-radius:999px;font-weight:700;font-size:13px}.lang button,.toolbar button,.mode button{border:1px solid var(--border);border-radius:9px;background:#fff;color:var(--navy);padding:9px 12px;font-weight:700;cursor:pointer}.header .lang button{border-color:#ffffff77;background:transparent;color:#fff}.lang button.active,.mode button.active{background:#fff;color:var(--navy)}.mode button.active{background:var(--navy);color:#fff}.wrap{max-width:1500px;margin:auto;padding:16px}.toolbar{margin-bottom:14px}.toolbar input,.toolbar select{font:inherit;border:1px solid var(--border);border-radius:8px;padding:9px 10px;background:#fff}.legend{margin-left:auto;font-size:12px;color:var(--muted)}.dot{width:14px;height:14px;border-radius:4px;display:inline-block;margin-right:4px;vertical-align:middle}.card{background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 4px 18px #10365d0d;padding:12px;margin-bottom:14px}.scroller{overflow:auto;-webkit-overflow-scrolling:touch}.sectionTitle{font-size:20px;color:var(--navy);margin:18px 0 10px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid var(--border);font-size:12px;text-align:left}.table th{background:var(--soft);color:var(--navy)}table.schedule{width:100%;min-width:980px;border-collapse:separate;border-spacing:4px}.schedule th{background:var(--soft);color:var(--navy);padding:10px;border-radius:8px;font-size:12px}.schedule thead th:not(:first-child){background:var(--navy);color:#fff}.schedule td{height:58px;padding:7px;text-align:center;border-radius:8px;font-size:12px}.free{background:var(--green);color:var(--greenText)}.booked{background:var(--red);color:var(--redText)}.partial{background:var(--orange);color:var(--orangeText)}.schedule td strong,.schedule td span{display:block}.schedule td span{font-size:10px;margin-top:3px}.monthGrid{display:grid;grid-template-columns:repeat(7,minmax(155px,1fr));gap:8px;min-width:1120px}.monthHead{font-size:12px;font-weight:700;color:var(--navy);background:var(--soft);padding:9px;border-radius:8px;text-align:center}.dayCell{min-height:180px;border:1px solid var(--border);border-radius:12px;padding:8px;background:#fff;cursor:pointer}.dayCell.out{opacity:.3}.dayTop{display:flex;justify-content:space-between;gap:6px;margin-bottom:7px}.dayNum{font-weight:700;color:var(--navy)}.dayNum .n{font-size:20px}.dayNum .m{font-size:10px;color:var(--muted);text-transform:uppercase}.dayMeta{font-size:10px;color:var(--muted);text-align:right}.slotPills{display:flex;flex-direction:column;gap:4px}.slotPill{border-radius:8px;padding:5px 6px;font-size:10px;line-height:1.25}.slotPill strong{display:block}.slotPill.free{background:var(--green);color:var(--greenText)}.slotPill.partial{background:var(--orange);color:var(--orangeText)}.slotPill.booked{background:var(--red);color:var(--redText)}.pitchNote{font-size:10px;color:var(--muted);margin-top:5px}.teamCards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.teamCard{border:1px solid var(--border);border-radius:12px;background:#fff;padding:12px}.teamCard h3{margin:0 0 6px;color:var(--navy)}.dayRow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}.small{font-size:11px;color:var(--muted)}.mobileDay{display:none}@media(max-width:760px){.header{align-items:flex-start;flex-direction:column}.wrap{padding:10px}.legend{margin-left:0}.monthGrid{grid-template-columns:1fr;min-width:0}.monthHead{display:none}.dayCell.out{display:none}table.schedule{display:none}.mobileDay{display:flex;flex-direction:column;gap:8px}.mSlot{border:1px solid var(--border);border-radius:10px;padding:8px}.mSlot h4{margin:0 0 6px;color:var(--navy)}.mEntry{border-radius:8px;padding:6px 8px;font-size:12px;margin-top:5px}}</style></head><body><div class="header"><div class="brand"><div style="font-size:34px">⚽</div><div><h1>FOOTBALL WORLD ANTALYA</h1><p id="seasonText">Pitch availability · 18 Oct 2026 – 30 Apr 2027</p></div></div><div class="actions"><div class="lang"><button id="enBtn" class="active" onclick="setLang('en')">EN</button><button id="plBtn" onclick="setLang('pl')">PL</button></div><div class="badge" id="badge">STAFF · READ ONLY</div></div></div><div class="wrap"><div class="toolbar"><div class="mode"><button id="dayBtn" class="active" onclick="setMode('day')">Day</button><button id="monthBtn" onclick="setMode('month')">Month</button><button id="teamsBtn" onclick="setMode('teams')">Teams</button></div><button id="prevBtn" onclick="move(-1)">←</button><input id="date" type="date" min="2026-10-18" max="2027-04-30" value="2027-01-20" onchange="render()"><button id="nextBtn" onclick="move(1)">→</button><label class="small" id="pitchFilterLabel">Pitch filter:</label><select id="pitchFilter" onchange="renderMonth()"><option value="all">All pitches</option><option value="1">Pitch 1</option><option value="2">Pitch 2</option><option value="3">Pitch 3</option><option value="4">Pitch 4</option><option value="5">Pitch 5</option><option value="6">Pitch 6</option></select><div class="legend"><span><i class="dot" style="background:var(--green)"></i><span id="freeLegend">Available</span></span><span><i class="dot" style="background:var(--orange)"></i>Partly booked</span><span><i class="dot" style="background:var(--red)"></i><span id="bookedLegend">Booked</span></span></div></div><div id="dayView"><div class="card"><div class="scroller"><table class="schedule" id="schedule"></table></div><div class="mobileDay" id="mobileDay"></div></div><h2 class="sectionTitle" id="listTitle"></h2><div class="card"><div class="scroller"><table class="table" id="list"></table></div></div></div><div id="monthView" class="card" style="display:none"><div class="scroller"><div class="monthGrid" id="monthGrid"></div></div></div><div id="teamsView" style="display:none"><h2 class="sectionTitle" id="teamsTitle">Team overview</h2><div class="teamCards" id="teamsGrid"></div></div></div><script>const RATE=300,CFG=[['KOREA FC','2027-01-04','2027-02-01'],['Radomiak','2027-01-10','2027-01-20'],['Bruk BET','2027-01-10','2027-01-20'],['ARKA Gdynia','2027-01-17','2027-01-27'],['Grodzisk FC','2027-01-20','2027-01-27']],TRAIN=['10:30–12:00','16:00–17:30'],SLOTS=['08:30–10:00','10:30–12:00','12:00–13:30','14:00–15:30','16:00–17:30'],P=[1,2,3,4,5,6];function mk(){const o=new Set,b=[];for(const[team,s,e]of CFG){for(let d=new Date(s+'T12:00:00'),z=new Date(e+'T12:00:00');d<=z;d.setDate(d.getDate()+1)){const ds=d.toISOString().slice(0,10);for(const time of TRAIN){let pitch=1;while(o.has(ds+'|'+pitch+'|'+time))pitch++;o.add(ds+'|'+pitch+'|'+time);b.push({date:ds,pitch,time,team,note:'Training',kind:'training'})}}}for(const ds of ['2026-10-18','2026-10-19','2026-10-20'])for(const time of SLOTS)for(const pitch of P)b.push({date:ds,pitch,time,team:'Junior CUP',note:'Junior CUP · all 6 pitches',kind:'event'});return b}const BOOKINGS=mk();let LANG='en',MODE='day';const T={en:{season:'Pitch availability · 18 Oct 2026 – 30 Apr 2027',badge:'STAFF · READ ONLY',day:'Day',month:'Month',teams:'Teams',free:'Available',booked:'Booked',time:'Time',pitch:'Pitch',team:'Team',status:'Status',training:'Training',event:'Event',reservations:'Bookings',weekdays:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],months:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],occupied:'occupied',pitchAll:'All pitches',filter:'Pitch filter',teamView:'Team overview'},pl:{season:'Dostępność boisk · 18.10.2026 – 30.04.2027',badge:'STAFF · TYLKO PODGLĄD',day:'Dzień',month:'Miesiąc',teams:'Drużyny',free:'Wolne',booked:'Zajęte',time:'Godzina',pitch:'Boisko',team:'Drużyna',status:'Status',training:'Trening',event:'Wydarzenie',reservations:'Rezerwacje',weekdays:['Pon','Wt','Śr','Czw','Pt','Sob','Niedz'],months:['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'],occupied:'zajęte',pitchAll:'Wszystkie boiska',filter:'Filtr boiska',teamView:'Widok drużyn'}};function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function setLang(l){LANG=l;enBtn.classList.toggle('active',l==='en');plBtn.classList.toggle('active',l==='pl');const x=T[l];seasonText.textContent=x.season;badge.textContent=x.badge;dayBtn.textContent=x.day;monthBtn.textContent=x.month;teamsBtn.textContent=x.teams;freeLegend.textContent=x.free;bookedLegend.textContent=x.booked;pitchFilterLabel.textContent=x.filter+':';pitchFilter.options[0].text=x.pitchAll;teamsTitle.textContent=x.teamView;render()}function setMode(m){MODE=m;['day','month','teams'].forEach(v=>document.getElementById(v+'Btn').classList.toggle('active',m===v));dayView.style.display=m==='day'?'block':'none';monthView.style.display=m==='month'?'block':'none';teamsView.style.display=m==='teams'?'block':'none';render()}function move(n){const d=new Date(date.value+'T12:00:00');MODE==='month'?d.setMonth(d.getMonth()+n):d.setDate(d.getDate()+n);date.value=d.toISOString().slice(0,10);render()}function dayBookings(ds){return BOOKINGS.filter(b=>b.date===ds)}function render(){MODE==='day'?renderDay():MODE==='month'?renderMonth():renderTeams()}function renderDay(){const x=T[LANG],ds=date.value,day=dayBookings(ds),map=new Map(day.map(b=>[b.pitch+'|'+b.time,b]));let h='<thead><tr><th>'+x.time+'</th>'+P.map(p=>`<th>${x.pitch} ${p}</th>`).join('')+'</tr></thead><tbody>';for(const t of SLOTS){h+=`<tr><th>${t}</th>`;for(const p of P){const b=map.get(p+'|'+t);h+=b?`<td class="booked"><strong>${esc(b.team)}</strong><span>${b.kind==='event'?x.event:x.training}</span></td>`:`<td class="free"><strong>${x.free}</strong></td>`}h+='</tr>'}schedule.innerHTML=h+'</tbody>';mobileDay.innerHTML=SLOTS.map(t=>`<div class="mSlot"><h4>${t}</h4>${P.map(p=>{const b=map.get(p+'|'+t);return b?`<div class="mEntry booked"><strong>${x.pitch} ${p} · ${esc(b.team)}</strong></div>`:`<div class="mEntry free"><strong>${x.pitch} ${p} · ${x.free}</strong></div>`}).join('')}</div>`).join('');listTitle.textContent=x.reservations+' — '+ds.split('-').reverse().join('.');let l=`<thead><tr><th>${x.time}</th><th>${x.pitch}</th><th>${x.team}</th><th>${x.status}</th></tr></thead><tbody>`;if(!day.length)l+=`<tr><td colspan="4">${x.free}</td></tr>`;else for(const b of day.sort((a,b)=>a.time.localeCompare(b.time)||a.pitch-b.pitch))l+=`<tr><td>${b.time}</td><td>${x.pitch} ${b.pitch}</td><td><strong>${esc(b.team)}</strong></td><td>${b.kind==='event'?x.event:x.booked}</td></tr>`;list.innerHTML=l+'</tbody>'}function renderMonth(){const x=T[LANG],sel=new Date(date.value+'T12:00:00'),y=sel.getFullYear(),m=sel.getMonth(),f=new Date(y,m,1),off=(f.getDay()+6)%7,g=new Date(y,m,1-off),pf=pitchFilter.value;let h='';for(const w of x.weekdays)h+=`<div class="monthHead">${w}</div>`;for(let i=0;i<42;i++){const d=new Date(g);d.setDate(g.getDate()+i);const ds=d.toISOString().slice(0,10),day=dayBookings(ds),active=new Set(day.map(b=>b.pitch)).size;let pills='';for(const slot of SLOTS){const sb=day.filter(b=>b.time===slot).sort((a,b)=>a.pitch-b.pitch);if(pf==='all'){if(!sb.length)pills+=`<div class="slotPill free"><strong>${slot} · ${x.free}</strong></div>`;else{const names=[...new Set(sb.map(b=>b.team))],allSame=sb.length===6&&names.length===1,cls=sb.length===6?'booked':'partial',detail=allSame?`${esc(names[0])} · ${x.pitchAll}`:sb.map(b=>`${esc(b.team)} – ${x.pitch} ${b.pitch}`).join('<br>');pills+=`<div class="slotPill ${cls}"><strong>${slot} · ${sb.length}/6 ${x.occupied}</strong><div>${detail}</div></div>`}}else{const b=sb.find(z=>String(z.pitch)===pf);pills+=b?`<div class="slotPill booked"><strong>${slot} · ${esc(b.team)}</strong><div>${x.pitch} ${b.pitch}</div></div>`:`<div class="slotPill free"><strong>${slot} · ${x.free}</strong></div>`}}h+=`<div class="dayCell ${d.getMonth()===m?'':'out'}" onclick="date.value='${ds}';setMode('day')"><div class="dayTop"><div class="dayNum"><div class="n">${d.getDate()}</div><div class="m">${x.months[d.getMonth()]}</div></div><div class="dayMeta">${day.length} slots<br>${active}/6 ${x.occupied}</div></div><div class="slotPills">${pills}</div><div class="pitchNote">${pf==='all'?x.pitchAll:x.pitch+' '+pf}</div></div>`}monthGrid.innerHTML=h}function renderTeams(){const x=T[LANG],teams=[...new Set(BOOKINGS.map(b=>b.team))];teamsGrid.innerHTML=teams.map(team=>{const bs=BOOKINGS.filter(b=>b.team===team),dates=[...new Set(bs.map(b=>b.date))].sort(),isEvent=bs.some(b=>b.kind==='event');let rows='';for(const ds of dates){const day=bs.filter(b=>b.date===ds);rows+=`<div class="dayRow"><strong>${ds.split('-').reverse().join('.')}</strong><div>${isEvent?'All 6 pitches · full day':day.length+' × '+x.training}</div></div>`}return `<div class="teamCard"><h3>${esc(team)}</h3><div class="small">${dates[0]} – ${dates[dates.length-1]} · ${dates.length} days</div>${rows}</div>`}).join('')}render();</script></body></html>
