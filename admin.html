<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Football World Antalya — Admin</title><style>:root{--navy:#102f50;--navy2:#173d63;--bg:#f4f7fa;--border:#dbe4ec;--muted:#66778a;--free:#dff5e3;--freeText:#176b2d;--booked:#ffe0e0;--bookedText:#8b1e1e}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#162337}.header{background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;padding:18px 24px;display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{display:flex;gap:12px;align-items:center}.brand h1{margin:0;font-size:24px}.brand p{margin:4px 0 0;opacity:.8;font-size:13px}.ball{font-size:34px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.badge{background:#fff;color:var(--navy);padding:9px 14px;border-radius:999px;font-weight:700;font-size:13px}.lang button{border:1px solid #ffffff77;background:transparent;color:#fff;padding:9px 12px;border-radius:8px}.lang button.active{background:#fff;color:var(--navy)}.wrap{max-width:1500px;margin:auto;padding:18px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}input,button,select{font:inherit;border:1px solid var(--border);border-radius:8px;background:#fff;padding:10px 12px;min-height:42px}button{cursor:pointer;color:var(--navy);font-weight:700}.mode{display:flex;gap:6px;flex-wrap:wrap}.mode button.active{background:var(--navy);color:#fff}.legend{margin-left:auto;display:flex;gap:15px;font-size:12px;color:var(--muted)}.dot{width:14px;height:14px;border-radius:4px;display:inline-block;vertical-align:middle;margin-right:5px}.card{background:#fff;border:1px solid var(--border);border-radius:13px;box-shadow:0 4px 18px rgba(16,47,80,.05);padding:12px;margin-bottom:14px}.scroller{overflow:auto;-webkit-overflow-scrolling:touch}.sectionTitle{font-size:18px;color:var(--navy);margin:0 0 10px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid var(--border);font-size:12px;text-align:left}.table th{background:#eef3f7;color:var(--navy)}table.schedule{width:100%;min-width:1000px;border-collapse:separate;border-spacing:4px}.schedule th{background:#eaf0f5;color:var(--navy);padding:11px;font-size:12px;border-radius:7px}.schedule thead th:not(:first-child){background:var(--navy);color:#fff}.schedule td{height:58px;padding:7px;text-align:center;border-radius:8px;font-size:12px}.free{background:var(--free);color:var(--freeText)}.booked{background:var(--booked);color:var(--bookedText)}.schedule td strong,.schedule td span{display:block}.schedule td span{font-size:10px;margin-top:4px}.monthGrid{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;min-width:1080px}.monthHead{font-size:12px;font-weight:700;color:var(--navy);background:#eaf0f5;padding:9px;border-radius:7px;text-align:center}.dayCell{min-height:150px;border:1px solid var(--border);border-radius:10px;padding:8px;background:#fff;cursor:pointer}.dayCell.out{opacity:.35}.dayNum{font-weight:700;color:var(--navy);margin-bottom:7px;display:flex;align-items:baseline;gap:6px}.dayNum .num{font-size:20px}.dayNum .mon{font-size:11px;color:var(--muted);text-transform:uppercase}.dayStat{font-size:11px;margin:3px 0}.dayClubs{display:flex;flex-direction:column;gap:4px;margin-top:6px}.dayTag{background:#f8dada;color:var(--bookedText);border:1px solid #efc7c7;border-radius:8px;padding:5px 6px;font-size:10px;line-height:1.25}.dayTag strong,.dayTag span{display:block}.dayTag span{color:#6f2d2d;margin-top:1px}.dayFree{font-size:11px;color:var(--freeText);font-weight:700;margin-top:6px}.teamTop{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.teamStats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}.teamStat{background:#eef3f7;border-radius:10px;padding:10px}.teamStat span{display:block;font-size:10px;color:var(--muted)}.teamStat strong{font-size:18px;color:var(--navy)}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}.kpi{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px}.kpi span{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.kpi strong{font-size:24px;color:var(--navy)}.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.paid{color:#176b2d;font-weight:700}.due{color:#8b1e1e;font-weight:700}.small{font-size:11px;color:var(--muted)}.mobileDay{display:none}.mSlot{background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:10px}.mSlotTitle{font-weight:700;color:var(--navy);margin-bottom:8px}.mRows{display:grid;grid-template-columns:1fr 1fr;gap:7px}.mPitch{border-radius:8px;padding:8px;font-size:12px;min-height:55px}.mPitch strong,.mPitch span{display:block}.mPitch span{font-size:10px;margin-top:3px}@media(max-width:1000px){.wrap{padding:14px}.brand h1{font-size:21px}.toolbar{align-items:stretch}.legend{margin-left:0}.teamStats,.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.monthGrid{grid-template-columns:repeat(7,minmax(135px,1fr));min-width:980px}.table th,.table td{padding:10px;font-size:13px}}@media(max-width:640px){.header{padding:14px;align-items:flex-start;flex-direction:column}.brand{align-items:flex-start}.ball{font-size:28px}.brand h1{font-size:19px}.brand p{font-size:12px}.actions{width:100%;justify-content:space-between}.badge{font-size:11px;padding:8px 10px}.wrap{padding:10px}.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:8px}.mode{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr)}.mode button{width:100%}#date{width:100%;min-width:0}.legend{grid-column:1/-1;justify-content:flex-start}.desktopSchedule{display:none}.mobileDay{display:block}.mRows{grid-template-columns:1fr}.sectionTitle{font-size:17px}.table{min-width:0}.table thead{display:none}.table tbody,.table tr,.table td{display:block;width:100%}.table tr{border:1px solid var(--border);border-radius:10px;margin-bottom:8px;padding:8px;background:#fff}.table td{border:0;padding:4px 2px;font-size:12px}.table td:before{content:attr(data-label);font-weight:700;color:var(--muted);display:inline-block;min-width:115px}.teamStats,.kpis{grid-template-columns:1fr}.teamTop{display:block}.teamTop select{width:100%;margin-top:8px}.monthGrid{grid-template-columns:1fr;min-width:0}.monthHead{display:none}.dayCell.out{display:none}.dayCell{min-height:0}.dayClubs{gap:6px}.dayTag{font-size:12px;padding:8px}.dayTag span{font-size:11px}.card{padding:10px}.kpi strong{font-size:22px}}@media(orientation:landscape) and (max-width:900px){.desktopSchedule{display:block}.mobileDay{display:none}}</style></head><body><div class="header"><div class="brand"><div class="ball">⚽</div><div><h1>FOOTBALL WORLD ANTALYA</h1><p id="seasonText">Admin dashboard · 10 Dec 2026 – 30 Apr 2027</p></div></div><div class="actions"><div class="lang"><button id="enBtn" class="active" onclick="setLang('en')">EN</button><button id="plBtn" onclick="setLang('pl')">PL</button></div><div class="badge" id="badge">ADMIN · FINANCE + BOOKINGS</div></div></div><div class="wrap"><div class="toolbar"><div class="mode"><button id="dayBtn" class="active" onclick="setMode('day')">Day</button><button id="monthBtn" onclick="setMode('month')">Month</button><button id="teamsBtn" onclick="setMode('teams')">Teams</button></div><button id="prevBtn" onclick="move(-1)">←</button><input id="date" type="date" min="2026-12-10" max="2027-04-30" value="2027-01-20" onchange="render()"><button id="nextBtn" onclick="move(1)">→</button><div class="legend"><span><i class="dot" style="background:var(--free)"></i><span id="freeLegend">Available</span></span><span><i class="dot" style="background:var(--booked)"></i><span id="bookedLegend">Booked</span></span></div></div><div id="dayView"><div class="card desktopSchedule"><div class="scroller"><table class="schedule" id="schedule"></table></div></div><div class="mobileDay" id="mobileDay"></div></div><div id="monthView" class="card" style="display:none"><div class="scroller"><div class="monthGrid" id="monthGrid"></div></div></div><div id="teamsView" class="card" style="display:none"><div class="teamTop"><h2 class="sectionTitle" id="teamsTitle" style="margin:0">Team schedule</h2><select id="teamSelect" onchange="renderTeams()"></select></div><div class="teamStats" id="teamStats"></div><div class="scroller"><table class="table" id="teamSchedule"></table></div></div><div class="kpis"><div class="kpi"><span id="kDue">Amount due</span><strong id="dueTotal"></strong></div><div class="kpi"><span id="kPaid">Received</span><strong id="paidTotal"></strong></div><div class="kpi"><span id="kBalance">Outstanding</span><strong id="balanceTotal"></strong></div><div class="kpi"><span id="kTrain">Trainings</span><strong id="trainingTotal"></strong></div></div><div class="grid2"><div class="card"><h2 class="sectionTitle" id="teamTitle">Team financial summary</h2><div class="scroller"><table class="table" id="teamTable"></table></div></div><div class="card"><h2 class="sectionTitle" id="payTitle">Payments</h2><div class="scroller"><table class="table" id="paymentTable"></table></div><div class="small" id="payNote">Payments are updated from data you provide in ChatGPT.</div></div></div><div class="card"><h2 class="sectionTitle" id="bookTitle">Bookings on selected day</h2><div class="scroller"><table class="table" id="bookingTable"></table></div></div></div><script>const CFG=[['KOREA FC','2027-01-04','2027-02-01'],['Radomiak','2027-01-10','2027-01-20'],['Bruk BET','2027-01-10','2027-01-20'],['ARKA Gdynia','2027-01-17','2027-01-27'],['Grodzisk FC','2027-01-20','2027-01-27']];const TRAIN=['10:30–12:00','16:00–17:30'],ROWS=['08:30–10:00','10:30–12:00','12:00–13:30','14:00–15:30','16:00–17:30'],P=[1,2,3,4,5,6];function mk(){const o=new Set,b=[];for(const [team,s,e] of CFG){for(let d=new Date(s+'T12:00:00'),z=new Date(e+'T12:00:00');d<=z;d.setDate(d.getDate()+1)){const ds=d.toISOString().slice(0,10);for(const t of TRAIN){let p=1;while(o.has(ds+'|'+p+'|'+t))p++;o.add(ds+'|'+p+'|'+t);b.push({date:ds,pitch:p,time:t,team})}}}return b}const BOOKINGS=mk();function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}const RATE=300,PAYMENTS=[];let LANG='en',MODE='day';const T={en:{season:'Admin dashboard · 10 Dec 2026 – 30 Apr 2027',badge:'ADMIN · FINANCE + BOOKINGS',day:'Day',month:'Month',teams:'Teams',free:'Available',booked:'Booked',time:'Time',pitch:'Pitch',team:'Team',status:'Status',training:'Training',due:'Amount due',paid:'Received',balance:'Outstanding',trains:'Trainings',teamTitle:'Team financial summary',payTitle:'Payments',payNote:'Payments are updated from data you provide in ChatGPT.',bookTitle:'Bookings on selected day',date:'Date',amount:'Amount',note:'Note',none:'No payments yet',months:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],weekdays:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],allFree:'All available',slots:'bookings',occupied:'occupied',teamSched:'Team schedule',period:'Period',days:'Training days',total:'Total trainings',perDay:'Trainings/day'},pl:{season:'Panel administracyjny · 10.12.2026 – 30.04.2027',badge:'ADMIN · FINANSE + REZERWACJE',day:'Dzień',month:'Miesiąc',teams:'Drużyny',free:'Wolne',booked:'Zarezerwowane',time:'Godzina',pitch:'Boisko',team:'Drużyna',status:'Status',training:'Trening',due:'Należności',paid:'Wpłacono',balance:'Pozostało',trains:'Treningi',teamTitle:'Podsumowanie finansowe drużyn',payTitle:'Wpłaty',payNote:'Wpłaty aktualizuję na podstawie danych, które podajesz mi w ChatGPT.',bookTitle:'Rezerwacje w wybranym dniu',date:'Data',amount:'Kwota',note:'Uwagi',none:'Brak wpłat',months:['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'],weekdays:['Pon','Wt','Śr','Czw','Pt','Sob','Niedz'],allFree:'Wszystko wolne',slots:'rezerwacji',occupied:'zajętych',teamSched:'Harmonogram drużyny',period:'Okres',days:'Dni treningowe',total:'Liczba treningów',perDay:'Treningów/dzień'}};function money(n){return new Intl.NumberFormat(LANG==='pl'?'pl-PL':'en-IE',{style:'currency',currency:'EUR'}).format(n||0)}function summaries(){return CFG.map(c=>c[0]).map(team=>{const bs=BOOKINGS.filter(b=>b.team===team),due=bs.length*RATE,paid=PAYMENTS.filter(p=>p.team===team).reduce((s,p)=>s+Number(p.amount||0),0);return{team,count:bs.length,due,paid,balance:due-paid}})}function setLang(l){LANG=l;enBtn.classList.toggle('active',l==='en');plBtn.classList.toggle('active',l==='pl');seasonText.textContent=T[l].season;badge.textContent=T[l].badge;dayBtn.textContent=T[l].day;monthBtn.textContent=T[l].month;teamsBtn.textContent=T[l].teams;freeLegend.textContent=T[l].free;bookedLegend.textContent=T[l].booked;kDue.textContent=T[l].due;kPaid.textContent=T[l].paid;kBalance.textContent=T[l].balance;kTrain.textContent=T[l].trains;teamTitle.textContent=T[l].teamTitle;payTitle.textContent=T[l].payTitle;payNote.textContent=T[l].payNote;bookTitle.textContent=T[l].bookTitle;teamsTitle.textContent=T[l].teamSched;render()}function setMode(m){MODE=m;for(const x of ['day','month','teams'])document.getElementById(x+'Btn').classList.toggle('active',m===x);dayView.style.display=m==='day'?'block':'none';monthView.style.display=m==='month'?'block':'none';teamsView.style.display=m==='teams'?'block':'none';date.style.display=m==='teams'?'none':'';prevBtn.style.display=m==='teams'?'none':'';nextBtn.style.display=m==='teams'?'none':'';render()}function move(n){const d=new Date(date.value+'T12:00:00');MODE==='month'?d.setMonth(d.getMonth()+n):d.setDate(d.getDate()+n);date.value=d.toISOString().slice(0,10);render()}function render(){const s=summaries(),due=s.reduce((a,x)=>a+x.due,0),paid=s.reduce((a,x)=>a+x.paid,0);dueTotal.textContent=money(due);paidTotal.textContent=money(paid);balanceTotal.textContent=money(due-paid);trainingTotal.textContent=BOOKINGS.length;renderTeam(s);renderPayments();MODE==='day'?renderDay():MODE==='month'?renderMonth():renderTeams();renderBookingTable()}function renderTeam(s){const x=T[LANG];let h=`<thead><tr><th>${x.team}</th><th>${x.trains}</th><th>${x.due}</th><th>${x.paid}</th><th>${x.balance}</th></tr></thead><tbody>`;for(const r of s)h+=`<tr><td data-label="${x.team}"><strong>${esc(r.team)}</strong></td><td data-label="${x.trains}">${r.count}</td><td data-label="${x.due}">${money(r.due)}</td><td data-label="${x.paid}" class="paid">${money(r.paid)}</td><td data-label="${x.balance}" class="due">${money(r.balance)}</td></tr>`;teamTable.innerHTML=h+'</tbody>'}function renderPayments(){const x=T[LANG];let h=`<thead><tr><th>${x.date}</th><th>${x.team}</th><th>${x.amount}</th><th>${x.note}</th></tr></thead><tbody>`;if(!PAYMENTS.length)h+=`<tr><td colspan="4">${x.none}</td></tr>`;else for(const p of PAYMENTS.slice().sort((a,b)=>b.date.localeCompare(a.date)))h+=`<tr><td data-label="${x.date}">${p.date}</td><td data-label="${x.team}"><strong>${esc(p.team)}</strong></td><td data-label="${x.amount}" class="paid">${money(p.amount)}</td><td data-label="${x.note}">${esc(p.note||'')}</td></tr>`;paymentTable.innerHTML=h+'</tbody>'}function renderDay(){const x=T[LANG],ds=date.value,day=BOOKINGS.filter(b=>b.date===ds),map=new Map(day.map(b=>[b.pitch+'|'+b.time,b]));let h='<thead><tr><th>'+x.time+'</th>'+P.map(p=>`<th>${x.pitch} ${p}</th>`).join('')+'</tr></thead><tbody>';for(const t of ROWS){h+=`<tr><th>${t}</th>`;for(const p of P){const b=map.get(p+'|'+t);h+=b?`<td class="booked"><strong>${esc(b.team)}</strong><span>${x.training}</span></td>`:`<td class="free"><strong>${x.free}</strong></td>`}h+='</tr>'}schedule.innerHTML=h+'</tbody>';mobileDay.innerHTML=ROWS.map(t=>`<div class="mSlot"><div class="mSlotTitle">${t}</div><div class="mRows">${P.map(p=>{const b=map.get(p+'|'+t);return b?`<div class="mPitch booked"><strong>${x.pitch} ${p} · ${esc(b.team)}</strong><span>${x.training}</span></div>`:`<div class="mPitch free"><strong>${x.pitch} ${p}</strong><span>${x.free}</span></div>`}).join('')}</div></div>`).join('')}function renderMonth(){const x=T[LANG],s=new Date(date.value+'T12:00:00'),y=s.getFullYear(),m=s.getMonth(),f=new Date(y,m,1),off=(f.getDay()+6)%7,g=new Date(y,m,1-off);let h='';for(const w of x.weekdays)h+=`<div class="monthHead">${w}</div>`;for(let i=0;i<42;i++){const d=new Date(g);d.setDate(g.getDate()+i);const ds=d.toISOString().slice(0,10),day=BOOKINGS.filter(b=>b.date===ds),pitches=[...new Set(day.map(b=>b.pitch))],items=day.sort((a,b)=>a.time.localeCompare(b.time)||a.pitch-b.pitch).map(b=>`<div class="dayTag"><strong>${esc(b.team)}</strong><span>${x.pitch} ${b.pitch} · ${b.time}</span></div>`).join('');h+=`<div class="dayCell ${d.getMonth()===m?'':'out'}" onclick="date.value='${ds}';setMode('day')"><div class="dayNum"><span class="num">${d.getDate()}</span><span class="mon">${x.months[d.getMonth()]}</span></div>${day.length?`<div class="dayStat"><strong>${day.length}</strong> ${x.slots}</div><div class="dayStat">${pitches.length}/6 ${x.occupied}</div><div class="dayClubs">${items}</div>`:`<div class="dayFree">${x.allFree}</div>`}</div>`}monthGrid.innerHTML=h}function renderTeams(){const x=T[LANG];if(!teamSelect.options.length)teamSelect.innerHTML=CFG.map(c=>`<option>${esc(c[0])}</option>`).join('');const team=teamSelect.value||CFG[0][0],bs=BOOKINGS.filter(b=>b.team===team),dates=[...new Set(bs.map(b=>b.date))];teamStats.innerHTML=`<div class="teamStat"><span>${x.period}</span><strong>${dates[0]} – ${dates[dates.length-1]}</strong></div><div class="teamStat"><span>${x.days}</span><strong>${dates.length}</strong></div><div class="teamStat"><span>${x.total}</span><strong>${bs.length}</strong></div>`;let h=`<thead><tr><th>${x.date}</th><th>${x.perDay}</th><th>${x.time}</th><th>${x.pitch}</th></tr></thead><tbody>`;for(const ds of dates){const day=bs.filter(b=>b.date===ds).sort((a,b)=>a.time.localeCompare(b.time));h+=`<tr><td data-label="${x.date}"><strong>${ds}</strong></td><td data-label="${x.perDay}">${day.length}</td><td data-label="${x.time}">${day.map(b=>b.time).join('<br>')}</td><td data-label="${x.pitch}">${day.map(b=>x.pitch+' '+b.pitch).join('<br>')}</td></tr>`}teamSchedule.innerHTML=h+'</tbody>'}function renderBookingTable(){const x=T[LANG],day=BOOKINGS.filter(b=>b.date===date.value).sort((a,b)=>a.time.localeCompare(b.time)||a.pitch-b.pitch);let h=`<thead><tr><th>${x.time}</th><th>${x.pitch}</th><th>${x.team}</th><th>${x.due}</th></tr></thead><tbody>`;if(!day.length)h+=`<tr><td colspan="4">—</td></tr>`;else for(const b of day)h+=`<tr><td data-label="${x.time}">${b.time}</td><td data-label="${x.pitch}">${x.pitch} ${b.pitch}</td><td data-label="${x.team}"><strong>${esc(b.team)}</strong></td><td data-label="${x.due}">${money(RATE)}</td></tr>`;bookingTable.innerHTML=h+'</tbody>'}render();</script></body></html>
