<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Football World Antalya — Admin</title><style>
:root{--navy:#102f50;--navy2:#173d63;--green:#2f7d45;--bg:#f4f7fa;--border:#dbe4ec;--muted:#66778a;--free:#dff5e3;--freeText:#176b2d;--booked:#ffe0e0;--bookedText:#8b1e1e;--blue:#e8f0fb}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#162337}.header{background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;padding:18px 24px;display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{display:flex;gap:12px;align-items:center}.ball{font-size:34px}.brand h1{margin:0;font-size:24px}.brand p{margin:4px 0 0;opacity:.8;font-size:13px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.badge{background:#fff;color:var(--navy);padding:9px 14px;border-radius:999px;font-weight:700;font-size:13px}.lang button{border:1px solid #ffffff77;background:transparent;color:#fff;padding:8px 11px;border-radius:8px}.lang button.active{background:#fff;color:var(--navy)}.wrap{max-width:1500px;margin:auto;padding:18px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}.kpi{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px}.kpi span{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.kpi strong{font-size:24px;color:var(--navy)}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}input,button{font:inherit;border:1px solid var(--border);border-radius:8px;background:#fff;padding:9px 11px}button{cursor:pointer;color:var(--navy);font-weight:700}.mode button.active{background:var(--navy);color:#fff}.legend{margin-left:auto;display:flex;gap:15px;font-size:12px;color:var(--muted)}.dot{width:14px;height:14px;border-radius:4px;display:inline-block;vertical-align:middle;margin-right:5px}.card{background:#fff;border:1px solid var(--border);border-radius:13px;box-shadow:0 4px 18px rgba(16,47,80,.05);padding:12px;margin-bottom:14px}.scroller{overflow:auto}.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.sectionTitle{font-size:18px;color:var(--navy);margin:0 0 10px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid var(--border);font-size:12px;text-align:left}.table th{background:#eef3f7;color:var(--navy)}table.schedule{width:100%;min-width:1000px;border-collapse:separate;border-spacing:4px}.schedule th{background:#eaf0f5;color:var(--navy);padding:11px;font-size:12px;border-radius:7px}.schedule thead th:not(:first-child){background:var(--navy);color:#fff}.schedule td{height:58px;padding:7px;text-align:center;border-radius:8px;font-size:12px}.free{background:var(--free);color:var(--freeText)}.booked{background:var(--booked);color:var(--bookedText)}.schedule td strong,.schedule td span{display:block}.schedule td span{font-size:10px;margin-top:4px}.monthGrid{display:grid;grid-template-columns:repeat(7,minmax(145px,1fr));gap:8px;min-width:1040px}.monthHead{font-size:12px;font-weight:700;color:var(--navy);background:#eaf0f5;padding:9px;border-radius:7px;text-align:center}.dayCell{min-height:148px;border:1px solid var(--border);border-radius:10px;padding:8px;background:#fff;cursor:pointer}.dayCell.out{opacity:.35}.dayNum{font-weight:700;color:var(--navy);margin-bottom:7px;display:flex;gap:6px;align-items:baseline}.dayNum .num{font-size:20px}.dayNum .mon{font-size:11px;color:var(--muted);text-transform:uppercase}.dayStat{font-size:11px;margin:3px 0}.dayClubs{display:flex;flex-direction:column;gap:4px;margin-top:6px}.dayTag{font-size:10px;background:#f8dada;color:var(--bookedText);border:1px solid #efc7c7;border-radius:8px;padding:4px 6px}.dayTag strong,.dayTag span{display:block}.dayTag span{color:#6f2d2d}.dayFree{font-size:11px;color:var(--freeText);font-weight:700;margin-top:6px}.paid{color:#176b2d;font-weight:700}.due{color:#8b1e1e;font-weight:700}.small{font-size:11px;color:var(--muted)}@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}@media(max-width:600px){.header{align-items:flex-start;flex-direction:column}.legend{margin-left:0}.wrap{padding:10px}}
</style></head><body>
<div class="header"><div class="brand"><div class="ball">⚽</div><div><h1>FOOTBALL WORLD ANTALYA</h1><p id="seasonText">Admin dashboard · 10 Dec 2026 – 30 Apr 2027</p></div></div><div class="actions"><div class="lang"><button id="enBtn" class="active" onclick="setLang('en')">EN</button><button id="plBtn" onclick="setLang('pl')">PL</button></div><div class="badge" id="adminBadge">ADMIN · FINANCE + BOOKINGS</div></div></div>
<div class="wrap">
<div class="kpis"><div class="kpi"><span id="kDue">Amount due</span><strong id="dueTotal"></strong></div><div class="kpi"><span id="kPaid">Received</span><strong id="paidTotal"></strong></div><div class="kpi"><span id="kBalance">Outstanding</span><strong id="balanceTotal"></strong></div><div class="kpi"><span id="kTrain">Trainings</span><strong id="trainingTotal"></strong></div></div>
<div class="toolbar"><div class="mode"><button id="dayBtn" class="active" onclick="setMode('day')">Day</button><button id="monthBtn" onclick="setMode('month')">Month</button></div><button onclick="move(-1)">←</button><input id="date" type="date" min="2026-12-10" max="2027-04-30" value="2027-01-20" onchange="render()"><button onclick="move(1)">→</button><div class="legend"><span><i class="dot" style="background:var(--free)"></i><span id="freeLegend">Available</span></span><span><i class="dot" style="background:var(--booked)"></i><span id="bookedLegend">Booked</span></span></div></div>
<div id="dayView" class="card"><div class="scroller"><table class="schedule" id="schedule"></table></div></div><div id="monthView" class="card" style="display:none"><div class="scroller"><div class="monthGrid" id="monthGrid"></div></div></div>
<div class="grid2"><div class="card"><h2 class="sectionTitle" id="teamTitle">Team financial summary</h2><div class="scroller"><table class="table" id="teamTable"></table></div></div><div class="card"><h2 class="sectionTitle" id="payTitle">Payments</h2><div class="scroller"><table class="table" id="paymentTable"></table></div><div class="small" id="payNote">Payments are updated from data you provide in ChatGPT.</div></div></div>
<div class="card"><h2 class="sectionTitle" id="bookTitle">Bookings on selected day</h2><div class="scroller"><table class="table" id="bookingTable"></table></div></div>
</div>
<script>
const RATE=300;
const CFG=[['KOREA FC','2027-01-04','2027-02-01'],['Radomiak','2027-01-10','2027-01-20'],['Bruk BET','2027-01-10','2027-01-20'],['ARKA Gdynia','2027-01-17','2027-01-27'],['Grodzisk FC','2027-01-20','2027-01-27']];
const TRAIN=['10:30–12:00','16:00–17:30'];const ROWS=['08:30–10:00','10:00–10:30','10:30–12:00','12:00–13:00','13:00–14:30','14:30–16:00','16:00–17:30'];const P=[1,2,3,4,5,6];
const PAYMENTS=[];
let LANG='en',MODE='day';
const T={en:{season:'Admin dashboard · 10 Dec 2026 – 30 Apr 2027',badge:'ADMIN · FINANCE + BOOKINGS',day:'Day',month:'Month',free:'Available',booked:'Booked',time:'Time',pitch:'Pitch',team:'Team',status:'Status',training:'Training',due:'Amount due',paid:'Received',balance:'Outstanding',trains:'Trainings',teamTitle:'Team financial summary',payTitle:'Payments',payNote:'Payments are updated from data you provide in ChatGPT.',bookTitle:'Bookings on selected day',date:'Date',amount:'Amount',note:'Note',none:'No payments yet',months:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],weekdays:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],allFree:'All available'},pl:{season:'Panel administracyjny · 10.12.2026 – 30.04.2027',badge:'ADMIN · FINANSE + REZERWACJE',day:'Dzień',month:'Miesiąc',free:'Wolne',booked:'Zarezerwowane',time:'Godzina',pitch:'Boisko',team:'Drużyna',status:'Status',training:'Trening',due:'Należności',paid:'Wpłacono',balance:'Pozostało',trains:'Treningi',teamTitle:'Podsumowanie finansowe drużyn',payTitle:'Wpłaty',payNote:'Wpłaty aktualizuję na podstawie danych, które podajesz mi w ChatGPT.',bookTitle:'Rezerwacje w wybranym dniu',date:'Data',amount:'Kwota',note:'Uwagi',none:'Brak wpłat',months:['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'],weekdays:['Pon','Wt','Śr','Czw','Pt','Sob','Niedz'],allFree:'Wszystko wolne'}};
function mk(){const o=new Set,b=[];for(const [team,s,e] of CFG){for(let d=new Date(s+'T12:00:00'),z=new Date(e+'T12:00:00');d<=z;d.setDate(d.getDate()+1)){const ds=d.toISOString().slice(0,10);for(const t of TRAIN){let p=1;while(o.has(ds+'|'+p+'|'+t))p++;o.add(ds+'|'+p+'|'+t);b.push({date:ds,pitch:p,time:t,team,amount:RATE})}}}return b}const BOOKINGS=mk();
function money(n){return new Intl.NumberFormat(LANG==='pl'?'pl-PL':'en-IE',{style:'currency',currency:'EUR'}).format(n||0)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function summaries(){return CFG.map(c=>c[0]).map(team=>{const bs=BOOKINGS.filter(b=>b.team===team),due=bs.length*RATE,paid=PAYMENTS.filter(p=>p.team===team).reduce((s,p)=>s+Number(p.amount||0),0);return{team,count:bs.length,due,paid,balance:due-paid}})}
function setLang(l){LANG=l;enBtn.classList.toggle('active',l==='en');plBtn.classList.toggle('active',l==='pl');seasonText.textContent=T[l].season;adminBadge.textContent=T[l].badge;dayBtn.textContent=T[l].day;monthBtn.textContent=T[l].month;freeLegend.textContent=T[l].free;bookedLegend.textContent=T[l].booked;kDue.textContent=T[l].due;kPaid.textContent=T[l].paid;kBalance.textContent=T[l].balance;kTrain.textContent=T[l].trains;teamTitle.textContent=T[l].teamTitle;payTitle.textContent=T[l].payTitle;payNote.textContent=T[l].payNote;bookTitle.textContent=T[l].bookTitle;render()}
function setMode(m){MODE=m;dayBtn.classList.toggle('active',m==='day');monthBtn.classList.toggle('active',m==='month');dayView.style.display=m==='day'?'block':'none';monthView.style.display=m==='month'?'block':'none';render()}function move(n){const d=new Date(date.value+'T12:00:00');MODE==='month'?d.setMonth(d.getMonth()+n):d.setDate(d.getDate()+n);date.value=d.toISOString().slice(0,10);render()}
function render(){const s=summaries(),due=s.reduce((a,x)=>a+x.due,0),paid=s.reduce((a,x)=>a+x.paid,0);dueTotal.textContent=money(due);paidTotal.textContent=money(paid);balanceTotal.textContent=money(due-paid);trainingTotal.textContent=BOOKINGS.length;renderTeam(s);renderPayments();MODE==='month'?renderMonth():renderDay();renderBookingTable()}
function renderTeam(s){const x=T[LANG];let h=`<thead><tr><th>${x.team}</th><th>${x.trains}</th><th>${x.due}</th><th>${x.paid}</th><th>${x.balance}</th></tr></thead><tbody>`;for(const r of s)h+=`<tr><td><strong>${esc(r.team)}</strong></td><td>${r.count}</td><td>${money(r.due)}</td><td class="paid">${money(r.paid)}</td><td class="due">${money(r.balance)}</td></tr>`;teamTable.innerHTML=h+'</tbody>'}
function renderPayments(){const x=T[LANG];let h=`<thead><tr><th>${x.date}</th><th>${x.team}</th><th>${x.amount}</th><th>${x.note}</th></tr></thead><tbody>`;if(!PAYMENTS.length)h+=`<tr><td colspan="4">${x.none}</td></tr>`;else for(const p of PAYMENTS.slice().sort((a,b)=>b.date.localeCompare(a.date)))h+=`<tr><td>${p.date}</td><td><strong>${esc(p.team)}</strong></td><td class="paid">${money(p.amount)}</td><td>${esc(p.note||'')}</td></tr>`;paymentTable.innerHTML=h+'</tbody>'}
function renderDay(){const x=T[LANG],ds=date.value,day=BOOKINGS.filter(b=>b.date===ds),map=new Map(day.map(b=>[b.pitch+'|'+b.time,b]));let h='<thead><tr><th>'+x.time+'</th>'+P.map(p=>`<th>${x.pitch} ${p}</th>`).join('')+'</tr></thead><tbody>';for(const t of ROWS){h+=`<tr><th>${t}</th>`;for(const p of P){const b=map.get(p+'|'+t);h+=b?`<td class="booked"><strong>${esc(b.team)}</strong><span>${x.training}</span></td>`:`<td class="free"><strong>${x.free}</strong></td>`}h+='</tr>'}schedule.innerHTML=h+'</tbody>'}
function renderMonth(){const x=T[LANG],s=new Date(date.value+'T12:00:00'),y=s.getFullYear(),m=s.getMonth(),f=new Date(y,m,1),off=(f.getDay()+6)%7,g=new Date(y,m,1-off);let h='';for(const w of x.weekdays)h+=`<div class="monthHead">${w}</div>`;for(let i=0;i<42;i++){const d=new Date(g);d.setDate(g.getDate()+i);const ds=d.toISOString().slice(0,10),day=BOOKINGS.filter(b=>b.date===ds);const tags=day.sort((a,b)=>a.time.localeCompare(b.time)||a.pitch-b.pitch).map(b=>`<div class="dayTag"><strong>${esc(b.team)}</strong><span>${x.pitch} ${b.pitch} · ${b.time}</span></div>`).join('');h+=`<div class="dayCell ${d.getMonth()===m?'':'out'}" onclick="date.value='${ds}';setMode('day')"><div class="dayNum"><span class="num">${d.getDate()}</span><span class="mon">${x.months[d.getMonth()]}</span></div>${day.length?`<div class="dayClubs">${tags}</div>`:`<div class="dayFree">${x.allFree}</div>`}</div>`}monthGrid.innerHTML=h}
function renderBookingTable(){const x=T[LANG],day=BOOKINGS.filter(b=>b.date===date.value).sort((a,b)=>a.time.localeCompare(b.time)||a.pitch-b.pitch);let h=`<thead><tr><th>${x.time}</th><th>${x.pitch}</th><th>${x.team}</th><th>${x.status}</th></tr></thead><tbody>`;if(!day.length)h+=`<tr><td colspan="4">—</td></tr>`;else for(const b of day)h+=`<tr><td>${b.time}</td><td>${x.pitch} ${b.pitch}</td><td><strong>${esc(b.team)}</strong></td><td>${x.booked}</td></tr>`;bookingTable.innerHTML=h+'</tbody>'}render();
</script></body></html>
