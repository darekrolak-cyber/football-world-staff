<style>

*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#17273a}.header{background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;padding:18px 22px;display:flex;justify-content:space-between;gap:14px;align-items:center;position:sticky;top:0;z-index:20}.brand{display:flex;gap:12px;align-items:center}.brand h1{margin:0;font-size:24px}.brand p{margin:4px 0 0;font-size:13px;opacity:.85}.actions,.toolbar,.mode,.legend{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.badge{background:#fff;color:var(--navy);padding:9px 14px;border-radius:999px;font-weight:700;font-size:13px}.lang button,.toolbar button,.mode button{border:1px solid var(--border);border-radius:9px;background:#fff;color:var(--navy);padding:9px 12px;font-weight:700;cursor:pointer}.header .lang button{border-color:#ffffff77;background:transparent;color:#fff}.lang button.active{background:#fff;color:var(--navy)}.mode button.active{background:var(--navy);color:#fff}.wrap{max-width:1500px;margin:auto;padding:16px}.toolbar{margin-bottom:14px}.toolbar input,.toolbar select{font:inherit;border:1px solid var(--border);border-radius:8px;padding:9px 10px;background:#fff}.legend{margin-left:auto;font-size:12px;color:var(--muted)}.dot{width:14px;height:14px;border-radius:4px;display:inline-block;margin-right:4px;vertical-align:middle}.card{background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 4px 18px #10365d0d;padding:12px;margin-bottom:14px}.scroller{overflow:auto;-webkit-overflow-scrolling:touch}.sectionTitle{font-size:20px;color:var(--navy);margin:18px 0 10px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid var(--border);font-size:12px;text-align:left}.table th{background:var(--soft);color:var(--navy)}table.schedule{width:100%;min-width:980px;border-collapse:separate;border-spacing:4px}.schedule th{background:var(--soft);color:var(--navy);padding:10px;border-radius:8px;font-size:12px}.schedule thead th:not(:first-child){background:var(--navy);color:#fff}.schedule td{height:58px;padding:7px;text-align:center;border-radius:8px;font-size:12px}.free{background:var(--green);color:var(--greenText)}.booked{background:var(--red);color:var(--redText)}.partial{background:var(--orange);color:var(--orangeText)}.schedule td strong,.schedule td span{display:block}.schedule td span{font-size:10px;margin-top:3px}.monthGrid{display:grid;grid-template-columns:repeat(7,minmax(155px,1fr));gap:8px;min-width:1120px}.monthHead{font-size:12px;font-weight:700;color:var(--navy);background:var(--soft);padding:9px;border-radius:8px;text-align:center}.dayCell{min-height:180px;border:1px solid var(--border);border-radius:12px;padding:8px;background:#fff;cursor:pointer}.dayCell.out{opacity:.3}.dayTop{display:flex;justify-content:space-between;gap:6px;margin-bottom:7px}.dayNum{font-weight:700;color:var(--navy)}.dayNum .n{font-size:20px}.dayNum .m{font-size:10px;color:var(--muted);text-transform:uppercase}.dayMeta{font-size:10px;color:var(--muted);text-align:right}.slotPills{display:flex;flex-direction:column;gap:4px}.slotPill{border-radius:8px;padding:5px 6px;font-size:10px;line-height:1.25}.slotPill strong{display:block}.slotPill.free{background:var(--green);color:var(--greenText)}.slotPill.partial{background:var(--orange);color:var(--orangeText)}.slotPill.booked{background:var(--red);color:var(--redText)}.pitchNote{font-size:10px;color:var(--muted);margin-top:5px}.teamCards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.teamCard{border:1px solid var(--border);border-radius:12px;background:#fff;padding:12px}.teamCard h3{margin:0 0 6px;color:var(--navy)}.dayRow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}.small{font-size:11px;color:var(--muted)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{background:#fff;border:1px solid var(--border);border-radius:1 @media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
@media(max-width:760px){.header{align-items:flex-start;flex-direction:column}.wrap{padding:10px}.legend{margin-left:0}.monthGrid{grid-template-columns:1fr;min-width:0}.monthHead{display:none}.dayCell.out{display:none}table.schedule{display:none}.mobileDay{display:flex;flex-direction:column;gap:8px}.mSlot{border:1px solid var(--border);border-radius:10px;padding:8px}.mSlot h4{margin:0 0 6px;color:var(--navy)}.mEntry{border-radius:8px;padding:6px 8px;font-size:12px;margin-top:5px}.kpis{grid-template-columns:1fr}.summaryTable{min-width:620px}}
</style></head>
<body>
<div class="header"><div class="brand"><div style="font-size:34px">⚽</div><div><h1>FOOTBALL WORLD ANTALYA</h1><p id="seasonText">Admin dashboard · 18 Oct 2026 – 30 Apr 2027</p></div></div><div class="actions"><div class="lang"><button id="enBtn" class="active" onclick="setLang('en')">EN</button><button id="plBtn" onclick="setLang('pl')">PL</button><button id="ukBtn" onclick="setLang('uk')">UKR</button></div><div class="badge" id="badge">ADMIN · FINANCE + BOOKINGS</div></div></div>
<div class="wrap">
<div class="toolbar"><div class="mode"><button id="dayBtn" class="active" onclick="setMode('day')">Day</button><button id="monthBtn" onclick="setMode('month')">Month</button><button id="teamsBtn" onclick="setMode('teams')">Teams</button></div><button onclick="move(-1)">←</button><input id="date" type="date" min="2026-10-18" max="2027-04-30" value="2027-01-20" onchange="render()"><button onclick="move(1)">→</button><label class="small" id="pitchFilterLabel">Pitch filter:</label><select id="pitchFilter" onchange="renderMonth()"><option value="all">All pitches</option><option value="1">Pitch 1</option><option value="2">Pitch 2</option><option value="3">Pitch 3</option><option value="4">Pitch 4</option><option value="5">Pitch 5</option><option value="6">Pitch 6</option></select><div class="legend"><span><i class="dot" style="background:var(--green)"></i><span id="freeLegend">Available</span></span><span><i class="dot" style="background:var(--orange)"></i><span id="partialLegend">Partly booked</span></span><span><i class="dot" style="background:var(--red)"></i><span id="bookedLegend">Booked</span></span></div></div>
<div id="dayView"><div class="card"><div class="scroller"><table class="schedule" id="schedule"></table></div><div class="mobileDay" id="mobileDay"></div></div><h2 class="sectionTitle" id="listTitle"></h2><div class="card"><div class="scroller"><table class="table" id="list"></table></div></div></div>
<div id="monthView" style="display:none"><div class="card"><h2 class="sectionTitle" id="summaryTitle" style="margin-top:0">Booking summary</h2><div class="scroller"><table class="table summaryTable" id="summaryTable"></table></div></div><div class="card"><div class="scroller"><div class="monthGrid" id="monthGrid"></div></div></div></div>
<div id="teamsView" style="display:none"><h2 class="sectionTitle" id="teamsTitle">Team overview</h2><div class="teamCards" id="teamsGrid"></div></div>
<div class="kpis"><div class="kpi"><span id="kDue">Amount due</span><strong id="dueTotal"></strong></div><div class="kpi"><span id="kPaid">Received</span><strong id="paidTotal"></strong></div><div class="kpi"><span id="kBalance">Outstanding</span><strong id="balanceTotal"></strong></div><div class="kpi"><span id="kTrain">Trainings</span><strong id="trainingTotal"></strong></div></div>
<div class="grid2" style="margin-top:14px"><div class="card"><h2 class="sectionTitle" id="teamTitle" style="margin-top:0">Team financial summary</h2><div class="scroller"><table class="table" id="teamTable"></table></div></div><div class="card"><h2 class="sectionTitle" id="payTitle" style="margin-top:0">Payments</h2><div class="scroller"><table class="table" id="paymentTable"></table></div><div class="small" id="payNote">Payments are updated from data you provide in ChatGPT.</div></div></div>
</div>
<script>
const RATE=300,CFG=[['KOREA FC','2027-01-04','2027-02-01'],['Radomiak','2027-01-10','2027-01-20'],['Bruk BET','2027-01-10','2027-01-20'],['ARKA Gdynia','2027-01-17','2027-01-27'],['Grodzisk FC','2027-01-20','2027-01-27']],TRAIN=['10:30–12:00','16:00–17:30'],SLOTS=['08:30–10:00','10:30–12:00','12:00–13:30','14:00–15:30','16:00–17:30'],P=[1,2,3,4,5,6],EVENTS=[{id:'jc1',name:'Junior CUP',start:'2026-10-18',end:'2026-10-20',due:8000},{id:'jc2',name:'Junior CUP',start:'2026-10-23',end:'2026-10-25',due:7000}],PAYMENTS=[{key:'jc1',team:'Junior CUP',date:'2026-10-15',amount:8000,note:'Bank transfer · payment for 18–20.10.2026'},{key:'jc2',team:'Junior CUP',date:'2026-10-23',amount:7000,note:'Bank transfer to EUR account · payment for 23–25.10.2026'}];
function range(s,e){const a=[];for(let d=new Date(s+'T12:00:00'),z=new Date(e+'T12:00:00');d<=z;d.setDate(d.getDate()+1))a.push(d.toISOString().slice(0,10));return a}
function mk(){const o=new Set,b=[];for(const[team,s,e]of CFG)for(const ds of range(s,e))for(const time of TRAIN){let pitch=1;while(o.has(ds+'|'+pitch+'|'+time))pitch++;o.add(ds+'|'+pitch+'|'+time);b.push({date:ds,pitch,time,team,kind:'training'})}for(const ev of EVENTS)for(const ds of range(ev.start,ev.end))for(const time of SLOTS)for(const pitch of P)b.push({date:ds,pitch,time,team:ev.name,kind:'event',eventId:ev.id});return b}
const BOOKINGS=mk(),FINANCE=[...CFG.map(c=>({key:c[0],team:c[0],label:BOOKINGS.filter(b=>b.team===c[0]&&b.kind==='training').length+' trainings',due:BOOKINGS.filter(b=>b.team===c[0]&&b.kind==='training').length*RATE})),...EVENTS.map(e=>({key:e.id,team:e.name,label:`${e.start.split('-').reverse().join('.')} – ${e.end.split('-').reverse().join('.')} · 3 days · all 6 pitches`,due:e.due}))];let LANG='en',MODE='day';
const T={
en:{season:'Admin dashboard · 18 Oct 2026 – 30 Apr 2027',badge:'ADMIN · FINANCE + BOOKINGS',day:'Day',month:'Month',teams:'Teams',free:'Available',booked:'Booked',partial:'Partly booked',time:'Time',pitch:'Pitch',team:'Team',status:'Status',training:'Training',event:'Event',reservations:'Bookings',weekdays:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],months:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],occupied:'occupied',pitchAll:'All pitches',filter:'Pitch filter',teamView:'Team overview',due:'Amount due',paid:'Received',balance:'Outstanding',trains:'Trainings',teamTitle:'Team financial summary',payTitle:'Payments',none:'No payments yet',note:'Note',amount:'Amount',date:'Date',payInfo:'Payments are updated from data you provide in ChatGPT.',fullDay:'full day',summary:'Booking summary',first:'First training',last:'Last training',pitches:'Pitch(es)',days:'days',allPitches:'All 6 pitches'},
pl:{season:'Panel administracyjny · 18.10.2026 – 30.04.2027',badge:'ADMIN · FINANSE + REZERWACJE',day:'Dzień',month:'Miesiąc',teams:'Drużyny',free:'Wolne',booked:'Zajęte',partial:'Częściowo zajęte',time:'Godzina',pitch:'Boisko',team:'Drużyna',status:'Status',training:'Trening',event:'Wydarzenie',reservations:'Rezerwacje',weekdays:['Pon','Wt','Śr','Czw','Pt','Sob','Niedz'],months:['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'],occupied:'zajęte',pitchAll:'Wszystkie boiska',filter:'Filtr boiska',teamView:'Widok drużyn',due:'Należności',paid:'Wpłacono',balance:'Pozostało',trains:'Treningi',teamTitle:'Podsumowanie finansowe drużyn',payTitle:'Wpłaty',none:'Brak wpłat',note:'Uwagi',amount:'Kwota',date:'Data',payInfo:'Wpłaty są aktualizowane na podstawie danych przekazywanych w ChatGPT.',fullDay:'cały dzień',summary:'Podsumowanie rezerwacji',first:'Pierwszy trening',last:'Ostatni trening',pitches:'Boisko/a',days:'dni',allPitches:'Wszystkie 6 boisk'},
uk:{season:'Адміністративна панель · 18.10.2026 – 30.04.2027',badge:'АДМІН · ФІНАНСИ + БРОНЮВАННЯ',day:'День',month:'Місяць',teams:'Команди',free:'Вільно',booked:'Зайнято',partial:'Частково зайнято',time:'Час',pitch:'Поле',team:'Команда',status:'Статус',training:'Тренування',event:'Подія',reservations:'Бронювання',weekdays:['Пн','Вт','Ср','Чт','Пт','Сб','Нд'],months:['січ','лют','бер','кві','тра','чер','лип','сер','вер','жов','лис','гру'],occupied:'зайнято',pitchAll:'Усі поля',filter:'Фільтр поля',teamView:'Огляд команд',due:'До сплати',paid:'Отримано',balance:'Залишок',trains:'Тренування',teamTitle:'Фінансовий підсумок команд',payTitle:'Платежі',none:'Платежів немає',note:'Примітка',amount:'Сума',date:'Дата',payInfo:'Платежі оновлюються на основі даних, які ви передаєте в ChatGPT.',fullDay:'весь день',summary:'Підсумок бронювань',first:'Перше тренування',last:'Останнє тренування',pitches:'Поле/поля',days:'дні',allPitches:'Усі 6 полів'}};
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function money(n){return new Intl.NumberFormat(LANG==='pl'?'pl-PL':LANG==='uk'?'uk-UA':'en-IE',{style:'currency',currency:'EUR'}).format(n||0)}
function fd(s){return s.split('-').reverse().join('.')}function dayBookings(ds){return BOOKINGS.filter(b=>b.date===ds)}
function setLang(l){LANG=l;enBtn.classList.toggle('active',l==='en');plBtn.classList.toggle('active',l==='pl');ukBtn.classList.toggle('active',l==='uk');const x=T[l];seasonText.textContent=x.season;badge.textContent=x.badge;dayBtn.textContent=x.day;monthBtn.textContent=x.month;teamsBtn.textContent=x.teams;freeLegend.textContent=x.free;partialLegend.textContent=x.partial;bookedLegend.textContent=x.booked;pitchFilterLabel.textContent=x.filter+':';pitchFilter.options[0].text=x.pitchAll;for(let i=1;i<=6;i++)pitchFilter.options[i].text=x.pitch+' '+i;teamsTitle.textContent=x.teamView;summaryTitle.textContent=x.summary;kDue.textContent=x.due;kPaid.textContent=x.paid;kBalance.textContent=x.balance;kTrain.textContent=x.trains;teamTitle.textContent=x.teamTitle;payTitle.textContent=x.payTitle;payNote.textContent=x.payInfo;render()}
function setMode(m){MODE=m;['day','month','teams'].forEach(v=>document.getElementById(v+'Btn').classList.toggle('active',m===v));dayView.style.display=m==='day'?'block':'none';monthView.style.display=m==='month'?'block':'none';teamsView.style.display=m==='teams'?'block':'none';render()}
function move(n){const d=new Date(date.value+'T12:00:00');MODE==='month'?d.setMonth(d.getMonth()+n):d.setDate(d.getDate()+n);date.value=d.toISOString().slice(0,10);render()}function render(){MODE==='day'?renderDay():MODE==='month'?renderMonth():renderTeams();renderFinance()}
function renderDay(){const x=T[LANG],ds=date.value,day=dayBookings(ds),map=new Map(day.map(b=>[b.pitch+'|'+b.time,b]));let h='<thead><tr><th>'+x.time+'</th>'+P.map(p=>`<th>${x.pitch} ${p}</th>`).join('')+'</tr></thead><tbody>';for(const t of SLOTS){h+=`<tr><th>${t}</th>`;for(const p of P){const b=map.get(p+'|'+t);h+=b?`<td class="booked"><strong>${esc(b.team)}</strong><span>${b.kind==='event'?x.event:x.training}</span></td>`:`<td class="free"><strong>${x.free}</strong></td>`}h+='</tr>'}schedule.innerHTML=h+'</tbody>';mobileDay.innerHTML=SLOTS.map(t=>`<div class="mSlot"><h4>${t}</h4>${P.map(p=>{const b=map.get(p+'|'+t);return b?`<div class="mEntry booked"><strong>${x.pitch} ${p} · ${esc(b.team)}</strong></div>`:`<div class="mEntry free"><strong>${x.pitch} ${p} · ${x.free}</strong></div>`}).join('')}</div>`).join('');listTitle.textContent=x.reservations+' — '+fd(ds);let l=`<thead><tr><th>${x.time}</th><th>${x.pitch}</th><th>${x.team}</th><th>${x.status}</th></tr></thead><tbody>`;if(!day.length)l+=`<tr><td colspan="4">${x.free}</td></tr>`;else for(const b of day.sort((a,b)=>a.time.localeCompare(b.time)||a.pitch-b.pitch))l+=`<tr><td>${b.time}</td><td>${x.pitch} ${b.pitch}</td><td><strong>${esc(b.team)}</strong></td><td>${b.kind==='event'?x.event:x.booked}</td></tr>`;list.innerHTML=l+'</tbody>'}
function renderMonth(){const x=T[LANG],sel=new Date(date.value+'T12:00:00'),y=sel.getFullYear(),m=sel.getMonth(),f=new Date(y,m,1),off=(f.getDay()+6)%7,g=new Date(y,m,1-off),pf=pitchFilter.value;let h='';for(const w of x.weekdays)h+=`<div class="monthHead">${w}</div>`;for(let i=0;i<42;i++){const d=new Date(g);d.setDate(g.getDate()+i);const ds=d.toISOString().slice(0,10),day=dayBookings(ds),active=new Set(day.map(b=>b.pitch)).size;let pills='';for(const slot of SLOTS){const sb=day.filter(b=>b.time===slot).sort((a,b)=>a.pitch-b.pitch);if(pf==='all'){if(!sb.length)pills+=`<div class="slotPill free"><strong>${slot} · ${x.free}</strong></div>`;else{const names=[...new Set(sb.map(b=>b.team))],allSame=sb.length===6&&names.length===1,cls=sb.length===6?'booked':'partial',detail=allSame?`${esc(names[0])} · ${x.pitchAll}`:sb.map(b=>`${esc(b.team)} – ${x.pitch} ${b.pitch}`).join('<br>');pills+=`<div class="slotPill ${cls}"><strong>${slot} · ${sb.length}/6 ${x.occupied}</strong><div>${detail}</div></div>`}}else{const b=sb.find(z=>String(z.pitch)===pf);pills+=b?`<div class="slotPill booked"><strong>${slot} · ${esc(b.team)}</strong><div>${x.pitch} ${b.pitch}</div></div>`:`<div class="slotPill free"><strong>${slot} · ${x.free}</strong></div>`}}h+=`<div class="dayCell ${d.getMonth()===m?'':'out'}" onclick="date.value='${ds}';setMode('day')"><div class="dayTop"><div class="dayNum"><div class="n">${d.getDate()}</div><div class="m">${x.months[d.getMonth()]}</div></div><div class="dayMeta">${day.length} slots<br>${active}/6 ${x.occupied}</div></div><div class="slotPills">${pills}</div><div class="pitchNote">${pf==='all'?x.pitchAll:x.pitch+' '+pf}</div></div>`}monthGrid.innerHTML=h;renderSummary()}
function renderTeams(){const x=T[LANG],cards=[];for(const[team,s,e]of CFG){let rows='';for(const ds of range(s,e))rows+=`<div class="dayRow"><strong>${fd(ds)}</strong><div>2 × ${x.training}</div></div>`;cards.push(`<div class="teamCard"><h3>${esc(team)}</h3><div class="small">${fd(s)} – ${fd(e)}</div>${rows}</div>`)}for(const ev of EVENTS){let rows='';for(const ds of range(ev.start,ev.end))rows+=`<div class="dayRow"><strong>${fd(ds)}</strong><div>${x.allPitches} · ${x.fullDay}</div></div>`;cards.push(`<div class="teamCard"><h3>${ev.name}</h3><div class="small">${fd(ev.start)} – ${fd(ev.end)}</div>${rows}</div>`)}teamsGrid.innerHTML=cards.join('')}
function renderSummary(){const x=T[LANG];let h=`<thead><tr><th>${x.team}</th><th>${x.trains}</th><th>${x.first}</th><th>${x.last}</th><th>${x.pitches}</th></tr></thead><tbody>`;for(const[team,s,e]of CFG){const bs=BOOKINGS.filter(b=>b.team===team&&b.kind==='training'),pitches=[...new Set(bs.map(b=>b.pitch))].sort((a,b)=>a-b);h+=`<tr><td><strong>${esc(team)}</strong></td><td>${bs.length}</td><td>${fd(s)}</td><td>${fd(e)}</td><td>${pitches.map(p=>x.pitch+' '+p).join(', ')}</td></tr>`}for(const ev of EVENTS)h+=`<tr><td><strong>${esc(ev.name)}</strong></td><td>3 ${x.days}</td><td>${fd(ev.start)}</td><td>${fd(ev.end)}</td><td>${x.allPitches}</td></tr>`;summaryTable.innerHTML=h+'</tbody>'}
function renderFinance(){const x=T[LANG],due=FINANCE.reduce((s,r)=>s+r.due,0),paid=PAYMENTS.reduce((s,p)=>s+Number(p.amount||0),0),trainCount=BOOKINGS.filter(b=>b.kind==='training').length;dueTotal.textContent=money(due);paidTotal.textContent=money(paid);balanceTotal.textContent=money(due-paid);trainingTotal.textContent=trainCount;let h=`<thead><tr><th>${x.team}</th><th>${x.trains}</th><th>${x.due}</th><th>${x.paid}</th><th>${x.balance}</th></tr></thead><tbody>`;for(const r of FINANCE){const rp=PAYMENTS.filter(p=>p.key===r.key||(!p.key&&p.team===r.team)).reduce((s,p)=>s+Number(p.amount||0),0);let label=r.label;if(LANG==='uk')label=label.replace('trainings','тренувань').replace('days','дні').replace('all 6 pitches','усі 6 полів');else if(LANG==='pl')label=label.replace('trainings','treningów').replace('days','dni').replace('all 6 pitches','wszystkie 6 boisk');h+=`<tr><td><strong>${esc(r.team)}</strong></td><td>${esc(label)}</td><td>${money(r.due)}</td><td>${money(rp)}</td><td>${money(r.due-rp)}</td></tr>`}teamTable.innerHTML=h+'</tbody>';let p=`<thead><tr><th>${x.date}</th><th>${x.team}</th><th>${x.amount}</th><th>${x.note}</th></tr></thead><tbody>`;if(!PAYMENTS.length)p+=`<tr><td colspan="4">${x.none}</td></tr>`;else for(const r of PAYMENTS){let note=r.note;if(LANG==='uk')note='Банківський переказ · оплата за 18–20.10.2026';else if(LANG==='pl')note='Przelew bankowy · płatność za 18–20.10.2026';p+=`<tr><td>${fd(r.date)}</td><td>${esc(r.team)}</td><td>${money(r.amount)}</td><td>${esc(note)}</td></tr>`}paymentTable.innerHTML=p+'</tbody>'}
render();
</script></body></html>
